<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holdings collection example</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.4/dist/full.css" rel="stylesheet" type="text/css"/>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
</head>

<body>
<div class="container prose mx-auto bg-slate-100 p-12 max-w-full min-h-screen" id="app">
    <div>Enter API token to use demo.</div>
    <h1 class="">Portfolio fetcher: {{ step }} </h1>
    <div v-if="error" class="alert alert-error"> {{error}} </div>
    <input class="w-96" type="password" v-model="apiToken" @input="onNewToken">

    <div v-if="step==='building'" class="overflow-scroll">
        <h2>Authenticate</h2>
        <iframe class="h-[1000px] w-[1280px]" :src="iFrameUrl" frameborder="0"></iframe>
    </div>

    <h2>Developer data</h2>
    <pre>{{user}}</pre>
    <pre>{{users}}</pre>
    <pre>{{embedUrls}}</pre>
</div>


<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<script>
    const {createApp, ref, onMounted} = Vue;
    //const NJORDA_API_SERVER = "https://api-v2.njorda-uat.se"
    const NJORDA_API_SERVER = "http://localhost:2010"


    const app = createApp({
        setup() {
            const step = ref("loading")
            const user = ref()
            const users = ref()
            const error = ref()
            const embedUrls = ref()
            const iFrameUrl = ref()
            const apiToken = ref(localStorage.getItem("njorda_api_token"))

            async function onNewToken(token) {
                localStorage.setItem("njorda_api_token", token.target.value)
                apiToken.value = token.target.value
                await loadInitialData()
            }

            async function fetchData(url, method = 'GET', bodyData = null) {
                const headers = {
                    'Authorization': `Bearer ${apiToken.value}`,
                    'Content-Type': 'application/json'
                };
                const options = {method, headers};
                if (bodyData && (method === 'POST' || method === 'PATCH')) {
                    options.body = JSON.stringify(bodyData);
                }
                return (await fetch(NJORDA_API_SERVER + url, options)).json();
            }

            async function loadInitialData() {
                // 1. Create an anonymous user for demo, normally would get an existing one.
                // user.value = await fetchData("/v2/data/users", "POST", {})

                // List useers
                users.value = (await fetchData("/v2/data/users", "GET"))['items']
                console.log()
                advisors = users.value.filter(u => u['is_org_advisor'])
                if(!advisors.length) {
                    error.value = "No advisors found, please create one in the dashboard."
                    return
                }
                user.value = advisors[0]
                const userId = advisors[0]['id']


                // 2. Get embedding URLS
                embedUrls.value = await fetchData(`/v2/data/data-providers`, "GET")
                embedUrls.value = await fetchData(`/v2/data/users/${userId}/embedding-urls`, "GET")

                iFrameUrl.value = embedUrls.value['embed_url']
                step.value = "building"
                // 5. Wait for operation in iframe to complete
                //setTimeout(pollCompletion, 1000)
            }

            onMounted(async () => {
                window.addEventListener("message", onIframeMessage, false)
                await loadInitialData()
            })


            function onIframeMessage(event) {
                console.log(event)
                console.log(event.data)
                const data = JSON.parse(event.data)
                if (data['event'] === 'done') {
                    console.log("Event: DONE")
                } else {
                    console.log("Unknown event: ", data)
                }
            }

            return {
                step,
                error,
                user,
                users,
                embedUrls,
                iFrameUrl,
                apiToken
            }
        }
    });
    app.mount('#app');
</script>

</body>
</html>
